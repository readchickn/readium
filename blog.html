<style>
  body { margin: 0; background: #ffffff; color: #111111; font-family: Georgia, serif; }
  html, body { overflow-x: hidden; }
  .wrap { width: 100%; max-width: 680px; margin: 0 auto; padding: 12px; box-sizing: border-box; }
  h1 { font-size: 28px; margin: 8px 0 4px 0; }
  h2 { font-size: 22px; margin: 10px 0; }
  p { font-size: 16px; line-height: 1.5; }
  a { color: #111111; }
  .topbar { font-size: 15px; margin: 4px 0 10px 0; }
  .hidden { display: none; }
  input, textarea { font-family: Georgia, serif; font-size: 16px; border: 3px solid #111111; padding: 8px; box-sizing: border-box; width: 100%; }
  .btn { display: block; width: 100%; font-family: Georgia, serif; font-size: 17px; font-weight: bold; background: #ffffff; color: #111111; border: 3px solid #111111; padding: 10px; cursor: pointer; margin: 8px 0; box-sizing: border-box; }
  .btn.small { width: auto; display: inline-block; padding: 6px 14px; font-size: 15px; }
  .err { color: #b00000; font-size: 15px; margin: 6px 0; }
  /* tile grid */
  .tiles { display: flex; flex-wrap: wrap; gap: 12px; }
  .tile { width: 200px; border: 3px solid #111111; background: #ffffff; cursor: pointer; box-sizing: border-box; }
  .tile img { width: 100%; height: 250px; object-fit: cover; object-position: top; display: block; border-bottom: 3px solid #111111; }
  .tile .t { font-size: 18px; font-weight: bold; padding: 8px; text-align: center; }
  /* post view: arrows, not buttons */
  .backlink { font-size: 20px; cursor: pointer; display: inline-block; margin: 4px 0 8px 0; }
  .pagetitle { font-size: 24px; font-weight: bold; margin: 4px 0; }
  .pagecount { font-size: 15px; color: #444444; margin: 2px 0 8px 0; }
  .viewer { display: flex; align-items: center; gap: 4px; width: 100%; box-sizing: border-box; }
  .viewer img { flex: 1 1 auto; min-width: 0; max-width: 620px; width: 100%; height: auto; display: block; border: 3px solid #111111; box-sizing: border-box; }
  .arrow { flex: 0 0 auto; font-size: 36px; line-height: 1; cursor: pointer; color: #111111; user-select: none; padding: 0 2px; }
  .arrow.off { color: #cccccc; cursor: default; }
  .hint { font-size: 14px; color: #444444; text-align: center; margin: 8px 0 0 0; }
  /* comments */
  .comments { margin-top: 18px; border-top: 3px solid #111111; padding-top: 8px; }
  .comments h2 { margin: 6px 0; }
  .comment { display: flex; gap: 8px; border: 2px solid #111111; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  .comment img.pfp { width: 28px; height: 28px; flex: 0 0 auto; image-rendering: pixelated; border: 2px solid #111111; }
  .comment .cbody { flex: 1 1 auto; min-width: 0; }
  .comment .cname { font-weight: bold; font-size: 15px; }
  .comment .cname.mod { text-decoration: underline; }
  .comment .ctime { font-size: 13px; color: #444444; font-weight: normal; }
  .comment .ctext { font-size: 16px; margin: 2px 0 0 0; overflow-wrap: break-word; }
  .comment .cdel { font-size: 14px; cursor: pointer; color: #b00000; }
  .signinbox { border: 2px solid #111111; padding: 10px; margin: 8px 0; box-sizing: border-box; }
  .signinbox input { margin: 4px 0; }
  .whoami { font-size: 15px; margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>chickn's blog</h1>
  <p class="topbar"><a href="index.html">&larr; back to readium</a></p>

  <div id="blog-tiles">
    <div class="tiles" id="blog-tile-list"></div>
  </div>

  <div id="blog-post" class="hidden">
    <span class="backlink" id="blog-back">&larr; all posts</span>
    <div class="pagetitle" id="blog-post-title"></div>
    <div class="pagecount" id="blog-page-count"></div>
    <div class="viewer">
      <span class="arrow" id="blog-prev">&larr;</span>
      <img id="blog-page-img" alt="blog post page">
      <span class="arrow" id="blog-next">&rarr;</span>
    </div>
    <p class="hint">tap the arrows to flip pages</p>

    <div class="comments" id="blog-comments">
      <h2>comments</h2>
      <div id="blog-signin" class="signinbox">
        <div style="font-size:15px;margin-bottom:4px;">sign in with your readium account to comment</div>
        <input id="blog-user" type="text" placeholder="username" autocomplete="username">
        <input id="blog-pass" type="password" placeholder="password" autocomplete="current-password">
        <button class="btn" id="blog-signin-btn" type="button">sign in</button>
        <div class="err" id="blog-signin-err"></div>
      </div>
      <div id="blog-whoami" class="whoami hidden"></div>
      <div id="blog-comment-form" class="hidden">
        <textarea id="blog-comment-text" rows="3" maxlength="300" placeholder="leave a comment..."></textarea>
        <button class="btn" id="blog-comment-btn" type="button">post comment</button>
        <div class="err" id="blog-comment-err"></div>
      </div>
      <div id="blog-comment-list"><p>loading comments...</p></div>
    </div>
  </div>
</div>

/* ---------- sign-in helpers (same as the main site) ---------- */
function validUsername(u) { return /^[a-z0-9._-]{3,20}$/.test(u); }
function loginEmail(username) { return username + "@readium.chat"; }
function friendlyAuthError(err) {
  var code = err && err.code ? err.code : "";
  if (code === "auth/user-not-found" || code === "auth/invalid-credential") {
    return "No account with that username.";

/* ---------- pfps (16x16 pixel art, same as the main site) ---------- */
var PALETTE = ["#ffffff", "#bbbbbb", "#666666", "#111111"];
var pfpCache = {};
function blankPfp() {
  var rows = [
    "1111111111111111",
    "1111111111111111",
    "1131111111111311",
    "1131111111111311",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111",
    "1111311111113111",
    "1111133333331111",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111",
    "1111111111111111"
  ];
  return rows.join("");
}
function pfpURL(pfpStr) {
  if (typeof pfpStr !== "string" || pfpStr.length !== 256 || /[^0-3]/.test(pfpStr)) {
    pfpStr = blankPfp();
  }
  if (pfpCache[pfpStr]) { return pfpCache[pfpStr]; }
  var url = "";
  try {
    var cv = document.createElement("canvas");
    cv.width = 16; cv.height = 16;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 16, 16);
    for (var y = 0; y < 16; y++) {
      for (var x = 0; x < 16; x++) {
        var ci = pfpStr.charAt(y * 16 + x);
        if ("123".indexOf(ci) !== -1) {
          ctx.fillStyle = PALETTE[parseInt(ci, 10)];
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
    url = cv.toDataURL("image/png");
  } catch (e) { url = ""; }
  if (!url) { url = pfpURL(blankPfp()); }
  pfpCache[pfpStr] = url;
  return url;
}
var pfpUserCache = {};
function fillPfpImg(img, uid) {
  if (!uid) { img.src = pfpURL(blankPfp()); return; }
  if (pfpUserCache[uid]) { img.src = pfpURL(pfpUserCache[uid]); return; }
  img.src = pfpURL(blankPfp());
  db.ref("users/" + uid + "/pfp").once("value", function (snap) {
    var s = snap.val() || blankPfp();
    pfpUserCache[uid] = s;
    try { img.src = pfpURL(s); } catch (e) {}
  }, function () {});
}

/* ---------- mods ---------- */
function isFounderUid(uid) { return !!uid && (uid === FOUNDER_UID || uid === FOUNDER_UID2); }
function isModUid(uid) {
  if (isFounderUid(uid)) { return true; }
  return !!(uid && modUids[uid]);
}
function canModerate() {
  if (!myUid) { return false; }
  if (isFounderUid(myUid)) { return true; }
  return !!(modUids[myUid] || helperUids[myUid]);
}
function loadModLists() {
  db.ref("mods").once("value", function (s) {
    var v = s.val() || {};
    modUids = {};
    for (var k in v) { if (v[k]) { modUids[k] = true; } }
  }, function () {});
  db.ref("helpers").once("value", function (s) {
    var v = s.val() || {};
    helperUids = {};
    for (var k in v) { if (v[k]) { helperUids[k] = true; } }
  }, function () {});
}

/* ---------- post view ---------- */
function showTiles() {
  curPost = -1;
  detachComments();
  document.getElementById("blog-tiles").className = "";
  document.getElementById("blog-post").className = "hidden";
}
function openPost(i) {
  curPost = i;
  curPage = 0;
  document.getElementById("blog-tiles").className = "hidden";
  document.getElementById("blog-post").className = "";
  renderPage();
  attachComments();
}
function renderPage() {
  var post = POSTS[curPost];
  document.getElementById("blog-post-title").textContent = post.title;
  document.getElementById("blog-page-count").textContent = "page " + (curPage + 1) + " of " + post.pages.length;
  document.getElementById("blog-page-img").src = post.pages[curPage];
  document.getElementById("blog-page-img").alt = post.title + " — page " + (curPage + 1);
  var prev = document.getElementById("blog-prev");
  var next = document.getElementById("blog-next");
  prev.className = "arrow" + (curPage <= 0 ? " off" : "");
  next.className = "arrow" + (curPage >= post.pages.length - 1 ? " off" : "");
}
function goPrev() {
  if (curPost < 0 || curPage <= 0) { return; }
  curPage--;
  renderPage();
}
function goNext() {
  if (curPost < 0) { return; }
  var post = POSTS[curPost];
  if (curPage >= post.pages.length - 1) { return; }
  curPage++;
  renderPage();
}
document.getElementById("blog-prev").onclick = goPrev;
document.getElementById("blog-next").onclick = goNext;
document.getElementById("blog-back").onclick = showTiles;
document.addEventListener("keydown", function (e) {
  if (curPost < 0) { return; }
  if (e.key === "ArrowLeft") { goPrev(); }
  if (e.key === "ArrowRight") { goNext(); }
});

/* ---------- comments ---------- */
var commentsRef = null;
var commentsCache = {};
function postId() {
  return curPost < 0 ? null : POSTS[curPost].id;
}
function fmtTime(ts) {
  try {
    var d = new Date(ts || 0);
    return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) { return ""; }
}
function detachComments() {
  if (commentsRef) { commentsRef.off(); commentsRef = null; }
  commentsCache = {};
}
function attachComments() {
  detachComments();
  var pid = postId();
  if (!pid) { return; }
  var list = document.getElementById("blog-comment-list");
  list.innerHTML = "<p>loading comments...</p>";
  commentsRef = db.ref("blogComments/" + pid).limitToLast(100);
  commentsRef.on("value", function (snap) {
    commentsCache = snap.val() || {};
    renderComments();
  }, function () {
    list.innerHTML = "<p>couldn't load comments.</p>";
  });
}
function renderComments() {
  var list = document.getElementById("blog-comment-list");
  list.innerHTML = "";
  var keys = Object.keys(commentsCache);
  if (!keys.length) {
    list.innerHTML = "<p>no comments yet — be the first!</p>";
    return;
  }
  keys.sort(function (a, b) { return (commentsCache[a].ts || 0) - (commentsCache[b].ts || 0); });
  for (var i = 0; i < keys.length; i++) {
    (function (cid) {
      var c = commentsCache[cid];
      var row = document.createElement("div");
      row.className = "comment";
      var img = document.createElement("img");
      img.className = "pfp";
      img.alt = "";
      fillPfpImg(img, c.uid);
      var body = document.createElement("div");
      body.className = "cbody";
      var name = document.createElement("div");
      name.className = "cname" + (isModUid(c.uid) ? " mod" : "");
      name.textContent = cleanName(c.name, c.uid);
      var time = document.createElement("span");
      time.className = "ctime";
      time.textContent = "  " + fmtTime(c.ts);
      name.appendChild(time);
      var text = document.createElement("div");
      text.className = "ctext";
      text.textContent = c.text || "";
      body.appendChild(name);
      body.appendChild(text);
      row.appendChild(img);
      row.appendChild(body);
      if (myUid && (c.uid === myUid || canModerate())) {
        var del = document.createElement("span");
        del.className = "cdel";
        del.textContent = "delete";
        del.onclick = function () {
          if (!postId()) { return; }
          db.ref("blogComments/" + postId() + "/" + cid).remove();
        };
        row.appendChild(del);
      }
      list.appendChild(row);
    })(keys[i]);
  }
}
function refreshAuthUI() {
  var signedIn = !!myUid;
  document.getElementById("blog-signin").className = signedIn ? "signinbox hidden" : "signinbox";
  document.getElementById("blog-whoami").className = signedIn ? "whoami" : "whoami hidden";
  document.getElementById("blog-comment-form").className = signedIn ? "" : "hidden";
  if (signedIn) {
    var w = document.getElementById("blog-whoami");
    w.textContent = "";
    var span = document.createElement("span");
    span.textContent = "signed in as " + myName + " ";
    var out = document.createElement("span");
    out.style.cursor = "pointer";
    out.style.textDecoration = "underline";
    out.textContent = "log out";
    out.onclick = function () { auth.signOut(); };
    w.appendChild(span);
    w.appendChild(out);
  }
  renderComments();
}
document.getElementById("blog-signin-btn").onclick = function () {
  var u = document.getElementById("blog-user").value.trim().toLowerCase();
  var p = document.getElementById("blog-pass").value;
  var err = document.getElementById("blog-signin-err");
  err.textContent = "";
  if (!validUsername(u)) { err.textContent = "usernames are 3-20 lowercase letters, numbers, . _ -"; return; }
  if (!p) { err.textContent = "enter your password."; return; }
  auth.signInWithEmailAndPassword(loginEmail(u), p).catch(function (e) {
    err.textContent = friendlyAuthError(e);
  });
};
document.getElementById("blog-comment-btn").onclick = function () {
  var ta = document.getElementById("blog-comment-text");
  var err = document.getElementById("blog-comment-err");
  err.textContent = "";
  if (!myUid) { err.textContent = "sign in first."; return; }
  var text = ta.value.trim();
  if (!text) { return; }
  if (text.length > 300) { err.textContent = "keep it under 300 characters."; return; }
  if (filterHit(text)) { err.textContent = "keep it clean!"; return; }
  var pid = postId();
  if (!pid) { return; }
  db.ref("blogComments/" + pid).push({
    uid: myUid,
    name: myName,
    text: text,
    ts: Date.now()
  }, function (e) {
    if (e) { err.textContent = "couldn't post. try again."; return; }
    ta.value = "";
  });
};
auth.onAuthStateChanged(function (user) {
  if (!user) {
    myUid = null;
    myName = "Reader";
    modUids = {};
    helperUids = {};
    refreshAuthUI();
    return;
  }
  myUid = user.uid;
  myName = user.displayName || "Reader";
  loadModLists();
  db.ref("users/" + user.uid + "/name").once("value", function (s) {
    if (s.val()) { myName = s.val(); }
    refreshAuthUI();
  }, function () { refreshAuthUI(); });
  refreshAuthUI();
});
refreshAuthUI();

// build the tiles
(function () {
  var list = document.getElementById("blog-tile-list");
  for (var i = 0; i < POSTS.length; i++) {
    (function (idx) {
      var post = POSTS[idx];
      var tile = document.createElement("div");
      tile.className = "tile";
      var img = document.createElement("img");
      img.src = post.cover;
      img.alt = post.title;
      var t = document.createElement("div");
      t.className = "t";
      t.textContent = post.title;
      tile.appendChild(img);
      tile.appendChild(t);
      tile.onclick = function () { openPost(idx); };
      list.appendChild(tile);
    })(i);
  }
})();
</script>
</body>
</html>
