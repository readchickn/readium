name: Publish Pastel UI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the Pastel build
        run: |
          cp index-pastel.html index.html
          rm index-pastel.html
          git config user.name "readchickn"
          git config user.email "readchickn@users.noreply.github.com"
          git add -A
          git commit -m "V8 Pastel UI + setting to go back to original style"
          git push
