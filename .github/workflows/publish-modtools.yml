name: Publish mod tools build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with mod tools build
        run: |
          cp index-mod-search-ban-v2.html index.html
          rm index-mod-search-ban-v2.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish mod tools build"
          git push
