name: Publish Pastel modes build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with Pastel modes build
        run: |
          cp index-pastel-modes.html index.html
          rm index-pastel-modes.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Pastel modes build" || echo "No changes to commit"
          git push
